name: Windows C++ CI (CMake + SFML 3.0 + C++23)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Windows)
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' --yes
          choco install ninja --yes
          choco install git --yes

      # Build SFML 3.0 from source
      - name: Build SFML 3.0
        run: |
          git clone --branch 3.0.x https://github.com/SFML/SFML.git
          cmake -S SFML -B SFML/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSFML_BUILD_EXAMPLES=OFF -DSFML_BUILD_DOC=OFF
          cmake --build SFML/build --config Release
          cmake --install SFML/build --prefix ${{ github.workspace }}/sfml-install

      # Configure and build your project
      - name: Configure CMake
        run: cmake -S . -B build -G Ninja `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_CXX_STANDARD=23 `
          -DSFML_DIR=${{ github.workspace }}/sfml-install/lib/cmake/SFML

      - name: Build
        run: cmake --build build --config Release

      # Run tests if defined
      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure
